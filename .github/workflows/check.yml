name: 検証
on: [push, pull_request]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: 単体テスト
        run: |
          swift --version
          swift run AntiSleepChecks
      - name: アプリ作成・署名検証
        run: |
          zsh scripts/build-app.sh
          ditto -c -k --sequesterRsrc --keepParent dist/AntiSleep.app dist/AntiSleep.zip
      - name: パネルの余白と表示状態を検証
        run: |
          swiftc -I .build/release/Modules Sources/AntiSleep/PowerPanelView.swift scripts/verify-panel-layout.swift .build/release/AntiSleepCore.build/*.o -o .build/AntiSleepLayoutChecks
          .build/AntiSleepLayoutChecks test-results/panel-layout
          python3 scripts/verify-panel-pixels.py test-results/panel-layout/off.png test-results/panel-layout/on.png --report test-results/panel-layout/pixels.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: panel-layout
          path: test-results/panel-layout
      - uses: actions/upload-artifact@v4
        with:
          name: AntiSleep
          path: dist/AntiSleep.zip
